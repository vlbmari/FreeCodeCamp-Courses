<!-- Build a Music Shopping Cart Page -->

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Shopping Cart Page</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      padding: 2rem;
    }

    #shopping-cart-container.flex {
      display: flex;
      gap: 2rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    #shopping-cart-container.flex-col {
      flex-direction: column;
    }

    @media (min-width: 1024px) {
      #shopping-cart-container.lg\:flex-row {
        flex-direction: row;
        align-items: flex-start;
      }
    }

    #products-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 0.75rem;
      padding: 1.5rem;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.75rem 1rem;
      align-items: center;
    }

    .card .quantity {
      color: #94a3b8;
      font-size: 0.875rem;
    }

    .card .price {
      font-weight: 600;
      color: #38bdf8;
      grid-column: 1 / 2;
    }

    #order-summary-container {
      background-color: #1e293b;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      min-width: 320px;
    }

    #order-summary-container .border-2 {
      border: 2px solid #334155;
    }

    #total {
      color: #94a3b8;
    }

    #total-amount {
      font-size: 1.5rem;
      font-weight: 700;
      color: #f8fafc;
    }

    .remove-button,
    a.bg-blue-600 {
      cursor: pointer;
      border: none;
      padding: 0.625rem 1.25rem;
      border-radius: 0.5rem;
      text-decoration: none;
      font-weight: 500;
      transition: background-color 0.2s ease;
    }

    .bg-red-600 {
      background-color: #ef4444;
      color: #fff;
      grid-column: 2 / 3;
      grid-row: 1 / 3;
    }

    .hover\:bg-red-700:hover {
      background-color: #dc2626;
    }

    .bg-blue-600 {
      background-color: #2563eb;
      color: #fff;
      display: block;
      margin-top: 0.5rem;
    }

    .hover\:bg-blue-700:hover {
      background-color: #1d4ed8;
    }

    .text-xl {
      font-size: 1.25rem;
      font-weight: 600;
    }

    .text-2xl {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .text-lg {
      font-size: 1.125rem;
    }

    .font-bold {
      font-weight: 700;
    }

    .text-center {
      text-align: center;
    }

    .rounded-lg {
      border-radius: 0.75rem;
    }
  </style>
</head>

<body>
  <div id="shopping-cart-container" class="flex flex-col lg:flex-row">
    <div id="products-container">
      <div class="card">
        <h2 class="text-xl">Fender Stratocaster</h2>
        <p class="quantity">Qtd: 1</p>
        <p class="price">$1,200.00</p>
        <button class="remove-button bg-red-600 hover:bg-red-700">Remove</button>
      </div>

      <div class="card">
        <h2 class="text-xl">Vinil - Dark Side of the Moon</h2>
        <p class="quantity">Qtd: 2</p>
        <p class="price">$70.00</p>
        <button class="remove-button bg-red-600 hover:bg-red-700">Remove</button>
      </div>
    </div>
    <div id="order-summary-container" class="rounded-lg border-2">
      <h2 class="text-2xl">Order Summary</h2>
      <p id="total" class="font-bold text-lg">Total:</p>
      <span id="total-amount">$1,270.00</span>
      <a href="#" class="text-center bg-blue-600 hover:bg-blue-700">Checkout</a>
    </div>
  </div>
</body>

</html>
