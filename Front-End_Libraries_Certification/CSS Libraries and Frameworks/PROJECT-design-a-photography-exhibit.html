<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photography Exhibit</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-stone-300 min-h-screen p-8">
    <h1 class="m-10 text-[25px] flex justify-center font-bold">Photography Exhibit</h1>
    <div class="main-container grid grid-cols-3 gap-6 max-w-6xl w-full">
      <article class="card rounded-2xl p-4 bg-white shadow-md flex flex-col gap-3">
        <img class="rounded-xl w-full h-48 object-cover" src="https://cdn.freecodecamp.org/curriculum/labs/colosseo.jpg" alt="Colosseum in Rome" />
        <h2 class="subheading font-bold text-xl text-stone-800">Roman Colosseum</h2>
        <p class="description text-sm text-stone-600">An iconic historical monument preserved through centuries in Italy.</p>
      </article>

      <article class="card rounded-2xl p-4 bg-white shadow-md flex flex-col gap-3">
        <img class="rounded-xl w-full h-48 object-cover" src="https://cdn.freecodecamp.org/curriculum/labs/alps.jpg" alt="Snow-covered Alps" />
        <h2 class="subheading font-bold text-xl text-stone-800">Alpine Peaks</h2>
        <p class="description text-sm text-stone-600">A majestic mountain landscape capturing the serenity of winter.</p>
      </article>

      <article class="card rounded-2xl p-4 bg-white shadow-md flex flex-col gap-3">
        <img class="rounded-xl w-full h-48 object-cover" src="https://cdn.freecodecamp.org/curriculum/labs/sea.jpg" alt="Coast and blue sea" />
        <h2 class="subheading font-bold text-xl text-stone-800">Coastal Horizon</h2>
        <p class="description text-sm text-stone-600">Crystal clear waters contrasting with the rocky shore at sunset.</p>
      </article>
    </div>
  </body>
</html>
