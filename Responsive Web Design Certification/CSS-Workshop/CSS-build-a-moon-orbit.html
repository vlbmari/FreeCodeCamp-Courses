<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Moon Orbit</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        * {}

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: black;
        }

        .space {
            width: 200px;
            height: 200px;
            position: relative;
        }

        .earth {
            border-radius: 50%;
            background-color: blue;
            width: 100px;
            height: 100px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: inset 0 0 15px 1px rgb(9, 212, 231);

        }

        .orbit {
            position: absolute;
            animation: orbit 5s linear infinite;
            width: 200px;
            height: 200px;
            transform: translate(-50%, -50%);
        }

        .moon {
            border-radius: 50%;
            background-color: rgb(176, 176, 176);
            position: absolute;
            width: 30px;
            height: 30px;
            left: 50%;
            top: 0;
            transform: translateX(-50%);
            box-shadow: 0 2px 8px 0 white;
        }

        @keyframes orbit {
            0% {
                transform: rotate(0deg) translate(-50%, -50%);
            }

            100% {
                transform: rotate(360deg) translate(-50%, -50%);
            }
        }
    </style>
</head>

<body>
    <div class="space">
        <div class="earth"></div>
        <div class="orbit">
            <div class="moon"></div>
        </div>
    </div>
</body>

</html>
