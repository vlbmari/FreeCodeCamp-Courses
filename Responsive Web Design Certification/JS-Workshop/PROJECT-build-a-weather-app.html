<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atmosphere Weather Dashboard</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-gradient);
            color: var(--text-main);
            padding: 1.5rem;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }

        .app-card {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .app-header {
            text-align: center;
            margin-bottom: 1.75rem;
        }

        .app-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 0.35rem;
        }

        .controls {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        select {
            flex: 1;
            background: #0f172a;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.75rem 1rem;
            border-radius: 12px;
            outline: none;
            font-size: 0.95rem;
            cursor: pointer;
        }

        select:focus {
            border-color: var(--accent-color);
        }

        button {
            background: var(--accent-color);
            color: #0f172a;
            border: none;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 0.75rem 1.25rem;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        button:hover {
            background: var(--accent-hover);
            color: #ffffff;
        }

        button:active {
            transform: scale(0.98);
        }

        .weather-display {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            animation: fadeIn 0.3s ease-in-out;
        }

        .weather-display.hidden {
            display: none;
        }

        .primary-info {
            text-align: center;
        }

        #location {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .icon-condition {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin: 0.25rem 0;
        }

        #weather-icon {
            width: 50px;
            height: 50px;
        }

        #weather-main {
            font-size: 1.1rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .temp-wrapper {
            margin-top: 0.25rem;
        }

        #main-temperature {
            font-size: 3rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .stat-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .stat-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <main class="app-card">
        <header class="app-header">
            <h1>Weather Forecast</h1>
            <p class="subtitle">Select a destination to check conditions</p>
        </header>

        <section class="controls">
            <label for="city-select" class="sr-only">Choose a city</label>
            <select id="city-select">
                <option value=""></option>
                <option value="new york">New York</option>
                <option value="los angeles">Los Angeles</option>
                <option value="chicago">Chicago</option>
                <option value="paris">Paris</option>
                <option value="tokyo">Tokyo</option>
                <option value="london">London</option>
            </select>
            <button id="get-weather-btn" type="button">Get Weather</button>
        </section>

        <!-- Weather Display Section -->
        <section id="weather-display" class="weather-display hidden">
            <div class="primary-info">
                <h2 id="location"></h2>
                <div class="icon-condition">
                    <img id="weather-icon" src="" alt="Current weather icon" />
                    <span id="weather-main"></span>
                </div>
                <div class="temp-wrapper">
                    <span id="main-temperature"></span>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-label">Feels Like</span>
                    <span id="feels-like" class="stat-value"></span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Humidity</span>
                    <span id="humidity" class="stat-value"></span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Wind Speed</span>
                    <span id="wind" class="stat-value"></span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Wind Gust</span>
                    <span id="wind-gust" class="stat-value"></span>
                </div>
            </div>
        </section>
    </main>

    <script>
        // Test Requirement: Functions must NOT be declared using const
        let getWeather = async function (city) {
            try {
                const response = await fetch(
                    `https://weather-proxy.freecodecamp.rocks/api/city/${city}`
                );

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                return data;
            } catch (error) {
                console.error(error);
            }
        };

        let showWeather = async function (city) {
            const data = await getWeather(city);

            if (!data) {
                alert("Something went wrong, please try again later.");
                return;
            }

            const weatherDisplay = document.getElementById("weather-display");
            if (weatherDisplay) {
                weatherDisplay.classList.remove("hidden");
            }

            // Value formatting helper: falls back to N/A for undefined values
            const getValue = (val, suffix = "") =>
                val !== undefined && val !== null ? `${val}${suffix}` : "N/A";

            // Elements
            const weatherIcon = document.getElementById("weather-icon");
            const mainTemp = document.getElementById("main-temperature");
            const feelsLike = document.getElementById("feels-like");
            const humidity = document.getElementById("humidity");
            const wind = document.getElementById("wind");
            const windGust = document.getElementById("wind-gust");
            const weatherMain = document.getElementById("weather-main");
            const locationEl = document.getElementById("location");

            // Populate data
            if (weatherIcon) {
                weatherIcon.src = data.weather?.[0]?.icon || "";
                weatherIcon.alt = data.weather?.[0]?.description || "Weather icon";
            }

            if (mainTemp) mainTemp.textContent = getValue(data.main?.temp);
            if (feelsLike) feelsLike.textContent = getValue(data.main?.feels_like);
            if (humidity) humidity.textContent = getValue(data.main?.humidity);
            if (wind) wind.textContent = getValue(data.wind?.speed);
            if (windGust) windGust.textContent = getValue(data.wind?.gust);
            if (weatherMain) weatherMain.textContent = getValue(data.weather?.[0]?.main);
            if (locationEl) locationEl.textContent = getValue(data.name);
        };

        // Event listener setup
        const getWeatherBtn = document.getElementById("get-weather-btn");
        const citySelect = document.querySelector("select");

        if (getWeatherBtn && citySelect) {
            getWeatherBtn.addEventListener("click", () => {
                const selectedCity = citySelect.value;
                if (!selectedCity) return; // Does nothing if no city selected
                showWeather(selectedCity);
            });
        }
    </script>
</body>

</html>
