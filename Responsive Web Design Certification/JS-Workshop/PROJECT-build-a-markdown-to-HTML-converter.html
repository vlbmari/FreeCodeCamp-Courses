<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown to HTML Converter</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        #markdown-input {
            width: 100%;
            height: 100px;
        }

        #html-output,
        #preview {
            height: 100px;
            display: inline-block;
            width: 100%;
            border: 1px solid #ccc;
            padding: 10px;
            margin: auto;
            white-space: pre-wrap;
            background-color: #f9f9f9;
        }

        @media (min-width: 600px) {

            #markdown-input,
            #html-output,
            #preview {
                height: 200px;
                margin: 0;
            }

            #container {
                display: flex;
                justify-content: space-evenly;
                gap: 10px;
            }
        }
    </style>
</head>

<body>
    <h1>Markdown to HTML Converter</h1>
    <div id="container">
        <div class="container">
            <h2>Markdown Input:</h2>
            <textarea id="markdown-input" placeholder="Enter your markdown here..."></textarea>
        </div>
        <div class="container">
            <h2>Raw HTML Output:</h2>
            <div id="html-output"></div>
        </div>
        <div class="container">
            <h2>HTML Preview:</h2>
            <div id="preview"></div>
        </div>
    </div>
    <script>
        const markdownInput = document.getElementById("markdown-input");
        const htmlOutput = document.getElementById("html-output");
        const preview = document.getElementById("preview");


        function convertMarkdown() {
            let content = markdownInput.value;


            content = content.replace(/^###\s(.*)/gm, '<h3>$1</h3>');
            content = content.replace(/^##\s(.*)/gm, '<h2>$1</h2>');
            content = content.replace(/^#\s(.*)/gm, '<h1>$1</h1>');


            content = content.replace(/^>\s{1}(.*)/gm, '<blockquote>$1</blockquote>');


            content = content.replace(/!\[(.*?)\]\((.*?)\)/gm, '<img src="$2" alt="$1">');
            content = content.replace(/\[(.*?)\]\((.*?)\)/gm, '<a href="$2">$1</a>');


            content = content.replace(/\*\*(.*?)\*\*|__(.*?)__/gm, '<strong>$1$2</strong>');
            content = content.replace(/\*(.*?)\*|_(.*?)_/gm, '<em>$1$2</em>');


            return content;
        }

        markdownInput.addEventListener("input", () => {
            htmlOutput.textContent = convertMarkdown();
            preview.innerHTML = convertMarkdown();
        })

    </script>
</body>

</html>
