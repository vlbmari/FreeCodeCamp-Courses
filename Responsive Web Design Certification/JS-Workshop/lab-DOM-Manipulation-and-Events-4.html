<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>
    Build a Set of Football Team Cards
  </title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: arial;
    }

    :root {
      --dark-grey: #0a0a23;
      --light-grey: #f5f6f7;
      --white: #ffffff;
      --black: #000;
    }

    body {
      background-color: var(--dark-grey);
      text-align: center;
      padding: 10px;
    }

    .title,
    .options-label,
    .team-stats,
    footer {
      color: var(--white);
    }

    .title {
      margin: 1.3rem 0;
    }

    .team-stats {
      display: flex;
      justify-content: space-around;
      flex-wrap: wrap;
      font-size: 1.3rem;
      margin: 1.2rem 0;
    }

    .options-label {
      font-size: 1.2rem;
    }

    .cards {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }

    .player-card {
      background-color: var(--light-grey);
      padding: 1.3rem;
      margin: 1.2rem;
      width: 300px;
      border-radius: 15px;
    }

    @media (max-width: 768px) {
      .team-stats {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <h1 class="title">Team stats</h1>
  <main>
    <div class="team-stats">
      <p>Team: <span id="team"></span></p>
      <p>Year: <span id="year"></span></p>
      <p>Head coach: <span id="head-coach"></span></p>
    </div>
    <label class="options-label" for="players">Filter Teammates:</label>
    <select name="players" id="players">
      <option value="all">All Players</option>
      <option value="forward">Position Forward</option>
      <option value="midfielder">Position Midfielder</option>
      <option value="defender">Position Defender</option>
      <option value="goalkeeper">Position Goalkeeper</option>
    </select>
    <div class="cards" id="player-cards">
    </div>
  </main>
  <footer>&copy; freeCodeCamp</footer>
  <script>
    //Build a Set of Football Team Cards
    const footballTeam = {
      team: "Spain",
      year: 2026,
      headCoach: "Luis de la Fuente",
      players: [
        { name: "Rodri", position: "midfielder", isCaptain: true },
        { name: "Lamine Yamal", position: "forward", isCaptain: false },
        { name: "Pedri", position: "midfielder", isCaptain: false },
        { name: "Dani Carvajal", position: "defender", isCaptain: false },
        { name: "Nico Williams", position: "forward", isCaptain: false },
        { name: "Gavi", position: "midfielder", isCaptain: false },
        { name: "Aymeric Laporte", position: "defender", isCaptain: false },
        { name: "Unai Simón", position: "goalkeeper", isCaptain: false },
        { name: "Dani Olmo", position: "midfielder", isCaptain: false },
        { name: "Alejandro Grimaldo", position: "defender", isCaptain: false }
      ]
    };


    const headCoach = document.getElementById("head-coach");
    const team = document.getElementById("team");
    const year = document.getElementById("year");

    team.innerText = footballTeam.team;
    headCoach.innerText = footballTeam.headCoach;
    year.innerText = footballTeam.year;


    function showPlayers(arr) {
      const playerCards = document.getElementById("player-cards");
      playerCards.innerHTML = "";


      for (let player of arr) {
        const divPlayerCard = document.createElement("div");
        playerCards.appendChild(divPlayerCard)
        divPlayerCard.setAttribute("class", "player-card");

        if (player.isCaptain) {
          divPlayerCard.innerHTML = `<h2>${player.name} (Captain)</h2><p>Position: ${player.position}</p>`
        } else {
          divPlayerCard.innerHTML = `<h2>${player.name}</h2><p>Position: ${player.position}</p>`
        }
      }
    }

    const playersSelect = document.getElementById("players")

    playersSelect.addEventListener("change", (e) => {
      if (e.target.value !== "all") {
        let newArr = footballTeam.players.filter((player) => player.position === e.target.value);
        showPlayers(newArr)
      } else {
        showPlayers(footballTeam.players);
      }
    })
    
    showPlayers(footballTeam.players);


  </script>
</body>

</html>
